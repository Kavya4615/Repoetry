<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Poem</title>

    <!-- Prevent flicker -->
    <script>
        (function () {
            if (localStorage.getItem("theme") === "dark") {
                document.documentElement.classList.add("dark");
            }
        })();
    </script>

    <style>
        :root {
            /* Light mode – same palette as transformer */
            --bg: linear-gradient(135deg, #ffe3cf, #ffe9dc, #ffd6c1);
            --page-bg: rgba(255, 247, 239, 0.9);
            --card-bg: rgba(255, 255, 255, 0.96);
            --border: rgba(0, 0, 0, 0.08);
            --text: #1d1c20;
            --muted: #8a8a96;
            --input-bg: #ffffff;
            --accent: #7b64ff;
            --accent-hover: #6a58ff;
        }

        /* 🌙 DARK MODE (50% orange + 50% black blend) */
        html.dark {
            --bg: linear-gradient(
                135deg,
                #ff7a2f 0%,
                #ff671f 35%,
                #0a0a0a 80%,
                #000000 100%
            );

            --page-bg: rgba(0, 0, 0, 0.82);

            --card-bg: rgba(10, 10, 10, 0.92);
            --border: rgba(255, 255, 255, 0.14);

            --text: #fff2e8;
            --muted: #e6bfa8;

            --input-bg: rgba(0, 0, 0, 0.72);

            --accent: #c7b5ff;
            --accent-hover: #b39dff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 18px 20px 28px;
            font-family: "Poppins", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shell {
            width: 100%;
            max-width: 900px;
            background: var(--page-bg);
            border-radius: 26px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        /* HEADER */
        .nav {
            padding: 14px 22px;
            background: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        html.dark .nav {
            background: rgba(0, 0, 0, 0.75);
            border-bottom-color: #3a3a3a;
        }

        .nav-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .nav-title {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-sub {
            font-size: 12px;
            color: var(--muted);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .nav-right a {
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            color: #7a5bff;
        }

        html.dark .nav-right a {
            color: #ffd7b8;
        }

        .toggle-box {
            cursor: pointer;
        }

        .toggle {
            width: 46px;
            height: 24px;
            background: #d0d0d0;
            border-radius: 999px;
            position: relative;
            transition: 0.3s;
        }

        html.dark .toggle {
            background: #3d3d3d;
        }

        .toggle-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ffffff;
            position: absolute;
            top: 2px;
            left: 3px;
            transition: 0.3s;
        }

        html.dark .toggle-circle {
            left: 23px;
            background: #ffe37a;
        }

        /* MAIN CONTENT */
        .inner {
            padding: 22px 24px 26px;
        }

        .card {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 20px 22px;
            border-radius: 22px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.15);
        }

        label {
            display: block;
            font-size: 13px;
            margin-top: 4px;
            margin-bottom: 4px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 4px;
            border-radius: 14px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            font-family: inherit;
            font-size: 14px;
            background: var(--input-bg);
            color: var(--text);
        }

        textarea {
            resize: vertical;
            min-height: 160px;
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--muted);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 18px;
            border-radius: 18px;
            border: none;
            background: var(--accent);
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-hover);
        }
    </style>
</head>
<body>

<div class="shell">
    <!-- HEADER WITH HOME + THEME TOGGLE -->
    <div class="nav">
        <div class="nav-left">
            <div class="nav-title">➕ Post a New Poem</div>
            <div class="nav-sub">Craft a new repoem and share it with everyone.</div>
        </div>

        <div class="nav-right">
            <a href="{% url 'home' %}"> Home</a>

            <div class="toggle-box" onclick="toggleTheme()">
                <div class="toggle">
                    <div class="toggle-circle"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- FORM -->
    <div class="inner">
        <div class="card">
            <form method="POST">
                {% csrf_token %}

                <label for="title">Title</label>
                <input id="title" type="text" name="title" placeholder="Poem title (optional)">

                <label for="language">Language</label>
                <select id="language" name="language">
                    <option value="te">Telugu</option>
                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                </select>

                <label for="text">Poem</label>
                <textarea id="text" name="text" placeholder="Write your poem here..."></textarea>

                <button type="submit">Post Poem</button>
            </form>
        </div>
    </div>
</div>

<script>
function toggleTheme() {
    document.documentElement.classList.toggle("dark");
    localStorage.setItem(
        "theme",
        document.documentElement.classList.contains("dark") ? "dark" : "light"
    );
}
</script>

</body>
</html>
