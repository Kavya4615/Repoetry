{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Post a Poem — Repoetry</title>
    <meta name="description" content="Compose and share your poetry with the Repoetry community." />
    <script>(()=>{if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');})()</script>
</head>
<body>
    <div id="app" class="app-main"></div>

    <script src="{% static 'js/base.js' %}"></script>
    <script src="{% static 'js/add_poem.js' %}"></script>
    <script>
        const user = {
            isAuthenticated: {{ user.is_authenticated|yesno:"true,false" }},
            username: "{{ user.username|default:'' }}"
        };
        renderHeader(user);
        initAddPoem('app');
    </script>
</body>
</html>
