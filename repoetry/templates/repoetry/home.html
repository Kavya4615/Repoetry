{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Repoetry — Where Code Becomes Poetry</title>
    <meta name="description" content="Follow devs, share verses born from commits and stack traces, and let AI help you polish every line." />
    <script>(()=>{if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');})()</script>
</head>
<body>
    <div id="app" class="app-main"></div>

    <script src="{% static 'js/base.js' %}"></script>
    <script src="{% static 'js/home.js' %}"></script>
    <script>
        const user = {
            isAuthenticated: {{ user.is_authenticated|yesno:"true,false" }},
            username: "{{ user.username|default:'' }}"
        };
        renderHeader(user);
        initHomeView('app', user);
    </script>
</body>
</html>
