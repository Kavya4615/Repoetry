{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Studio — Repoetry Transformer</title>
    <meta name="description" content="Transform Telugu poems into classical poetic forms using AI-powered structured analysis." />
    <script>(()=>{if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');})()</script>
</head>
<body>
    <div id="app" class="app-main"></div>

    <script src="{% static 'js/base.js' %}"></script>
    <script src="{% static 'js/transformer.js' %}"></script>
    <script>
        const user = {
            isAuthenticated: {{ user.is_authenticated|yesno:"true,false" }},
            username: "{{ user.username|default:'' }}"
        };
        renderHeader(user);
        initTransformer('app');
    </script>
</body>
</html>
