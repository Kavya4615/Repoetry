<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Poem Transformer</title>

    <!-- Prevent flicker -->
    <script>
        (function () {
            if (localStorage.getItem("theme") === "dark") {
                document.documentElement.classList.add("dark");
            }
        })();
    </script>

    <style>
        :root {
            /* LIGHT MODE — Soft Premium Orange (unchanged) */
            --bg: linear-gradient(135deg, #ffe3cf, #ffe9dc, #ffd6c1);
            --page-bg: rgba(255, 247, 239, 0.85);

            --outer-card-bg: rgba(255, 255, 255, 0.55);
            --card-bg: rgba(255, 255, 255, 0.92);
            --card-shadow: rgba(0, 0, 0, 0.18);

            --border: rgba(0, 0, 0, 0.12);
            --text: #1d1c20;
            --muted: #7a7a85;

            --input-bg: #ffffff;

            --accent: #7b64ff;
            --accent-hover: #6a58ff;
        }

        /* 🌙 DARK MODE – orange → black, no cut line */
        html.dark {
            /* full-page background */
            --bg: linear-gradient(
                145deg,
                #ff7a2f 0%,
                #ff6a1f 30%,
                #3a1a08 65%,
                #000000 100%
            );

            /* big rounded shell */
            --page-bg: linear-gradient(
                145deg,
                rgba(255, 122, 47, 0.10) 0%,
                rgba(0, 0, 0, 0.80) 100%
            );

            /* header strip + inner shell */
            --outer-card-bg: rgba(15, 7, 3, 0.92);

            /* inner card (form box) */
            --card-bg: rgba(10, 5, 5, 0.97);
            --card-shadow: rgba(0, 0, 0, 0.70);

            --border: rgba(255, 255, 255, 0.12);
            --text: #fef5ee;
            --muted: #e6c2a5;

            --input-bg: rgba(0, 0, 0, 0.85);

            --accent: #c3b5ff;
            --accent-hover: #ae9cff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 18px 20px 32px;
            font-family: "Poppins", system-ui, sans-serif;
            color: var(--text);
            background: var(--bg);
        }

        .page-shell {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--page-bg);
            border-radius: 28px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.35);
        }

        /* 🔑 Remove the visible border only in dark mode */
        html.dark .page-shell {
            border: none;
        }

        /* HEADER */
        .nav {
            padding: 18px 28px;
            background: var(--outer-card-bg);
            backdrop-filter: blur(26px) saturate(180%);
            -webkit-backdrop-filter: blur(26px) saturate(180%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 8px 28px var(--card-shadow);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 23px;
            font-weight: 700;
            background: linear-gradient(90deg, #ff7a3c, #ffb693);
            color: transparent;
            -webkit-background-clip: text;
        }

        html.dark .nav-left {
            background: linear-gradient(90deg, #ffbe7a, #ffe6b8);
            color: transparent;
            -webkit-background-clip: text;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .nav-right a {
            color: #7a5bff;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
        }

        html.dark .nav-right a {
            color: #ffe4c2;
        }

        .toggle-box {
            cursor: pointer;
        }

        .toggle {
            width: 50px;
            height: 26px;
            background: #d0d0d0;
            border-radius: 999px;
            position: relative;
            transition: 0.3s;
        }

        html.dark .toggle {
            background: #78421f;
        }

        .toggle-circle {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ffffff;
            position: absolute;
            top: 2px;
            left: 3px;
            transition: 0.3s;
        }

        html.dark .toggle-circle {
            left: 25px;
            background: #ffe37a;
        }

        /* MAIN CONTENT BACKDROP */
        .main-gradient {
            padding: 40px 22px 60px;
            background: linear-gradient(145deg, #ffe7d7, #fff0ea, #ffe3d1);
        }

        /* In dark mode let the shell gradient show through */
        html.dark .main-gradient {
            background: transparent;
        }

        .card-shell {
            max-width: 760px;
            margin: 0 auto;
        }

        .card {
            border-radius: 26px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            box-shadow: 0 20px 55px var(--card-shadow);
            backdrop-filter: blur(24px);
            padding: 26px 26px 24px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            resize: vertical;
            padding: 14px 16px;
            border-radius: 18px;
            border: 1px solid var(--border);
            margin-top: 6px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
        }

        textarea::placeholder {
            color: var(--muted);
        }

        select {
            width: 100%;
            padding: 13px 14px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin-top: 16px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 14px;
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border-radius: 18px;
            border: none;
            background: var(--accent);
            color: #ffffff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        /* OUTPUT BOX */
        .output-box {
            margin-top: 26px;
            padding: 20px 18px 18px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
            white-space: pre-line;
        }

        html.dark .output-box {
            background: rgba(0, 0, 0, 0.24);
        }

        .output-box h3 {
            margin: 0 0 10px;
        }

        .share-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .share-btn {
            flex: 1 1 120px;
            padding: 11px 12px;
            border-radius: 12px;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            border: none;
            text-decoration: none;
            font-size: 14px;
        }

        .listen-btn { background: #ff4fa9; }
        .stop-btn { background: #444; }
        .whatsapp-btn { background: #25d366; }
        .copy-btn { background: #ff9800; }
        .download-btn { background: #2196f3; }
    </style>
</head>

<body>

<div class="page-shell">
    <!-- HEADER -->
    <div class="nav">
        <div class="nav-left">
            <span class="icon">✨</span>
            <span>Repoetry Transformer</span>
        </div>

        <div class="nav-right">
            <a href="{% url 'home' %}"> Home</a>

            <div class="toggle-box" onclick="toggleTheme()">
                <div class="toggle">
                    <div class="toggle-circle"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-gradient">
        <div class="card-shell">
            <div class="card">
                <form method="POST" action="{% url 'transform_poem' %}">
                    {% csrf_token %}

                    <textarea name="poem"
                              placeholder="Enter your Telugu poem...">{{ original }}</textarea>

                    <select name="form">
                        <option value="Dwipada">Dwipada</option>
                        <option value="Kanda Padyam">Kanda Padyam</option>
                        <option value="Satakam">Satakam</option>
                        <option value="Utpalamala">Utpalamala</option>
                    </select>

                    <button type="submit" class="btn-primary">
                        ✨ <span>Transform</span>
                    </button>
                </form>

                {% if result %}
                <div class="output-box">
                    <h3>✨ {{ form_type }}</h3>
                    <p id="poemText">{{ result }}</p>

                    {% if audio_b64 %}
                    <audio id="audioPlayer">
                        <source src="data:audio/mp3;base64,{{ audio_b64 }}" type="audio/mp3">
                    </audio>
                    {% endif %}

                    <div class="share-buttons">
                        {% if audio_b64 %}
                        <button type="button" class="share-btn listen-btn" onclick="playAudio()">🔊 Listen</button>
                        <button type="button" class="share-btn stop-btn" onclick="stopAudio()">⏹ Stop</button>
                        {% endif %}

                        <a class="share-btn whatsapp-btn"
                           href="https://wa.me/?text={{ result|urlencode }}" target="_blank">WhatsApp</a>

                        <button type="button" class="share-btn copy-btn" onclick="copyPoem()">Copy</button>
                        <button type="button" class="share-btn download-btn" onclick="downloadPoem()">Download</button>
                    </div>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>

<script>
function toggleTheme() {
    document.documentElement.classList.toggle("dark");
    localStorage.setItem(
        "theme",
        document.documentElement.classList.contains("dark") ? "dark" : "light"
    );
}

function copyPoem() {
    const el = document.getElementById("poemText");
    if (!el) return;
    const text = el.innerText || el.textContent || "";
    navigator.clipboard.writeText(text);
}

function downloadPoem() {
    const el = document.getElementById("poemText");
    if (!el) return;
    const text = el.innerText || el.textContent || "";
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
    link.download = "poem.txt";
    link.click();
}

function playAudio() {
    const audio = document.getElementById("audioPlayer");
    if (audio) audio.play();
}

function stopAudio() {
    const audio = document.getElementById("audioPlayer");
    if (audio) {
        audio.pause();
        audio.currentTime = 0;
    }
}
</script>

</body>
</html>
